[project]
name = "zipper"
version = "0.1.0"
description = "Password-based encrypted ZIP archiver with filename encryption support"
requires-python = ">=3.13"
dependencies = ["cryptography>=50.0.0,<51.0.0", "pathspec>=1.1.1,<1.2.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["zipper"]

[tool.hatch.build.targets.wheel]
include = ["zipper"]

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "missing-copyright-notice",
  "missing-trailing-comma",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-magic-method",
  "undocumented-public-init",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-terminal-punctuation",
  "raw-string-in-exception",
  "f-string-in-exception",
  "boolean-type-hint-positional-argument",
  "boolean-default-value-positional-argument",
  "boolean-positional-value-in-call",
  "too-many-return-statements",
  "too-many-locals",
  "too-many-statements",
  "magic-value-comparison",
  "no-self-use",
  "too-many-statements-in-try-clause",
  "print",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
  "raise-vanilla-args",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert", "private-member-access"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["zipper"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^build/", "^tmp/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.rumdl]
respect_gitignore = true
exclude = [".claude/**"]
disable = [
  "MD013", # 行の長さは自由
  "MD024", # 重複した見出しを許可
  "MD025", # 複数のトップレベル見出しを許可
  "MD033", # HTML タグを許可
  "MD036", # 強調表示の過剰使用を許可
  "MD041", # ファイルの最初の行を見出しにする必要なし
]

[tool.rumdl.MD009]
strict = true
